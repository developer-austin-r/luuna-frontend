name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Pull Node base image with retry
        run: |
          for attempt in 1 2 3; do
            if docker pull node:24-alpine; then exit 0; fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            APP_ENV=development
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infra/compose/docker-compose.yml"
          target: "/home/ubuntu/luuna-frontend"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 10m
          command_timeout: 15m
          script_stop: true
          script: |
            set -e

            COMPOSE_FILE="/home/ubuntu/luuna-frontend/infra/compose/docker-compose.yml"
            ENV_FILE="/home/ubuntu/luuna-frontend/.env"

            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE not found. Create it on the server first."
              exit 1
            fi

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

            echo "Pulling latest frontend image..."
            sudo docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" pull --quiet

            # Ensure shared network exists (owned by backend, joined here as external).
            sudo docker network inspect luuna-network >/dev/null 2>&1 \
              || sudo docker network create luuna-network

            echo "Recreating frontend container..."
            sudo docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" \
              up -d --force-recreate --remove-orphans

            sudo docker image prune -f

            echo "=== Running containers ==="
            sudo docker ps
            echo "Frontend deployment complete."
